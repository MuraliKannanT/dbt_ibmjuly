sources:
  - name: src
    database: sourcedb
    schema: mkmall
    tables:
      - name: regions
        description: Raw data for region information
      - name: nations
        columns:
          - name: n_nationkey
            data_tests:
              - unique
              - not_null  
      - name: customers
      - name: lineitems
        description: Raw data for the line items for each order
      - name: suppliers
      - name: orders
        config:
          freshness:
            warn_after: {count: 152, period: day}
            error_after: {count: 153, period: day}
          loaded_at_field: o_orderdate::timestamp_ntz
