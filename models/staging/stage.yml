models:
  - name: stg_nations
    description: Table for nation's data
    columns:
      - name: nation_id
        description: Primary Key for this table
        data_tests:
          - unique
          - not_null
      - name: region_id
        description: Foreign Key for this table
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id
  - name: stg_regions
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE']
              config:
                store_failures: TRUE
  - name: stg_orders
    description: Order Information Table
    columns:
      - name: total_price
        data_tests:
          - order_values:
              description: Testing Order Values 
              arguments:
                val: 850
              config:
                store_failures: true


          


